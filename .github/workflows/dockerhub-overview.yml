name: Sync Docker Hub overview

# 改 README（或描述文件）后，自动把简介同步到 Docker Hub 仓库页面。
# 需要 secrets：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（与 docker-publish.yml 共用）
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/dockerhub-description.txt"
      - ".github/workflows/dockerhub-overview.yml"
  workflow_dispatch:

env:
  DOCKER_REPO: douyin-auto-fire
  DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync README + description to Docker Hub
        if: env.DH_USER != '' && env.DH_TOKEN != ''
        run: |
          node - <<'EOF'
          const https = require('https');
          const fs = require('fs');

          const USER = process.env.DH_USER;
          const PASS = process.env.DH_TOKEN;
          const REPO = process.env.DOCKER_REPO;
          const GH_REPO = process.env.GITHUB_REPOSITORY;          // owner/name
          const BRANCH = process.env.GITHUB_REF_NAME || 'main';

          const req = (opts) => new Promise((resolve, reject) => {
            const rq = https.request(opts, (r) => {
              const c = [];
              r.on('data', (d) => c.push(d));
              r.on('end', () => resolve({ status: r.statusCode, body: Buffer.concat(c).toString() }));
            });
            rq.on('error', reject);
            if (opts.body) rq.write(opts.body);
            rq.end();
          });

          (async () => {
            // 1) 登录 Docker Hub 拿 JWT
            const loginBody = JSON.stringify({ username: USER, password: PASS });
            const lg = await req({
              hostname: 'hub.docker.com', path: '/v2/users/login/', method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(loginBody) },
              body: loginBody,
            });
            let jwt;
            try { jwt = JSON.parse(lg.body).token; } catch (e) {}
            if (!jwt) throw new Error('Docker Hub login failed: ' + lg.body.slice(0, 200));

            // 2) README → full_description（相对资源改绝对地址，否则 Hub 上是破图）
            const raw = `https://raw.githubusercontent.com/${GH_REPO}/${BRANCH}`;
            const blob = `https://github.com/${GH_REPO}/blob/${BRANCH}`;
            // Docker Hub 页面只放精简版（镜像说明为主），完整介绍留在 GitHub
              let md = fs.readFileSync('docs/dockerhub-overview.md', 'utf8');
            md = md
              .replace(/<img([^>]*?)src="docs\//g, `<img$1src="${raw}/docs/`)
              .replace(/!\[([^\]]*)\]\(docs\//g, `![$1](${raw}/docs/`)
              .replace(/<img([^>]*?)src="\.\//g, `<img$1src="${raw}/`)
              .replace(/!\[([^\]]*)\]\(\.\//g, `![$1](${raw}/`)
              .replace(/\]\(LICENSE\)/g, `](${blob}/LICENSE)`)
              .replace(/\]\((docs\/[^)]+)\)/g, `](${blob}/$1)`);

            // 3) 短简介（≤100 字节，Hub 硬限制）
            const payload = { full_description: md };
            const descFile = '.github/dockerhub-description.txt';
            if (fs.existsSync(descFile)) {
              const desc = fs.readFileSync(descFile, 'utf8').trim().replace(/\s*\n\s*/g, ' ');
              const bytes = Buffer.byteLength(desc, 'utf8');
              if (bytes > 100) {
                console.log(`⚠️ 描述 ${bytes} 字节超过 100，跳过更新描述（仅更新详情）`);
              } else if (desc) {
                payload.description = desc;
                console.log(`描述（${bytes} 字节）: ${desc}`);
              }
            }

            // 4) PATCH
            const body = JSON.stringify(payload);
            const r = await req({
              hostname: 'hub.docker.com',
              path: `/v2/repositories/${USER}/${REPO}/`,
              method: 'PATCH',
              headers: {
                Authorization: 'Bearer ' + jwt,
                'Content-Type': 'application/json',
                'Content-Length': Buffer.byteLength(body),
              },
              body,
            });
            console.log(`Docker Hub ${USER}/${REPO} → ${r.status}`);
            if (r.status !== 200) {
              console.error(r.body.slice(0, 300));
              process.exit(1);
            }
            console.log(`✅ 详情 ${md.length} 字符已同步`);
          })().catch((e) => { console.error(e); process.exit(1); });
          EOF
